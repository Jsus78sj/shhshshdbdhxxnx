name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'تخطي flutter test (للطوارئ فقط)'
        type: boolean
        default: false

permissions:
  contents: write   # لازم لرفع APK إلى صفحة Releases عند وسم v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # توليد مجلد android (السكربت يتخطى هذه الخطوة إذا وُجد)
      - name: Create Android scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.bs8110.slabdesigner .
          fi

      # توقيع اختياري بمفتاحك: أضف الأسرار الأربعة في Settings > Secrets، وإلا يُوقَّع بمفتاح debug
      - name: Prepare release signing (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          PROPS
          sed -i 's/^[[:space:]]*//' android/key.properties

      - name: Build release APK
        env:
          SKIP_TESTS: ${{ inputs.skip_tests && '1' || '0' }}
        run: bash scripts/build_release_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bs8110-slab-designer-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # تحديث وسم "latest" ليشير إلى آخر commit (يُنشر عند push إلى main)
      - name: Move 'latest' tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      # صفحة Releases عامة لأي زائر (بدون تسجيل دخول) إذا كان المستودع Public
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'أحدث نسخة (Latest)' }}
          body: |
            تطبيق تصميم البلاطات المصمتة BS 8110.
            للهواتف الحديثة نزّل: app-arm64-v8a-release.apk
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
